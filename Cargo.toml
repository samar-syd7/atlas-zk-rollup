[workspace]
resolver = "2"

members = [
    "crates/prover",
    "crates/sequencer",
    "crates/node",
    "crates/primitives"
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Samar"]

[workspace.dependencies]

# Async
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# Parallelism
rayon = "1.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = { version = "0.8.12", features = ["bytecheck"] }
bytemuck = { version = "1.23", features = ["derive"] }

# Crypto
rand = "0.8.5"
sha2 = "0.11"
blake3 = "1.8"

# ZK
halo2_proofs = "0.3.2"
halo2curves = "0.6.1"

ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
ark-serialize = "0.5"
ark-bn254 = "0.5"
ark-std = "0.5"

# Ethereum
ethers = { version = "2.0", features = ["abigen"] }

# Environment
dotenvy = "0.15.7"

# Substrate
subxt = "0.44"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Benchmarking
criterion = "0.7"

# DB
rocksdb = "0.24.0"
bincode = "1.3.3"

# JSON-RPC
axum = "0.8.4"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors"] }